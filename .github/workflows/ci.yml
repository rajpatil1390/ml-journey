name: CI

# Runs on every pull request into main, so broken apps are caught before merge.
# No `paths:` filter on purpose: the "CI passed" job must report on every PR,
# including docs-only ones, so it can be a required status check.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual run checks every module

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # keep in sync with the Python version chosen on Streamlit Community Cloud

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List modules touched by this PR
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          all_modules=$(find . -maxdepth 1 -type d -regex './[0-9][0-9]-[a-z0-9-]*' -printf '%f\n' | sort)

          if [ "$EVENT_NAME" != "pull_request" ]; then
            modules="$all_modules"
          else
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE '^(\.github/workflows/|ruff\.toml$)'; then
              echo "CI or lint config changed: checking every module."
              modules="$all_modules"
            else
              modules=$(echo "$changed" | grep -oE '^[0-9]{2}-[a-z0-9-]+/' | tr -d '/' | sort -u || true)
            fi
          fi

          # Keep module folders that still exist (a deleted module has nothing to check).
          json=$(for m in $modules; do if [ -d "$m" ]; then echo "$m"; fi; done | jq -R . | jq -sc .)
          echo "Modules to check: $json"
          echo "modules=$json" >> "$GITHUB_OUTPUT"

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff check (Python files and notebooks)
        run: ruff check --output-format=github .

  module:
    name: Check ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt

      - name: Check module layout
        run: |
          for f in app.py requirements.txt README.md; do
            [ -f "$MODULE/$f" ] || { echo "::error::$MODULE/$f is missing"; exit 1; }
          done
          # Every non-comment line must look like `package==1.2.3` or `package[extra]==1.2.3`.
          unpinned=$(tr -d '\r' < "$MODULE/requirements.txt" \
            | grep -vE '^[[:space:]]*(#.*)?$' \
            | grep -vE '^[A-Za-z0-9._-]+(\[[A-Za-z0-9,._-]+\])?==[^=[:space:]]+([[:space:]]*#.*)?$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error file=$MODULE/requirements.txt::Every requirement must be pinned with ==. Unpinned lines:"
            echo "$unpinned"
            exit 1
          fi

      - name: Install module requirements
        run: pip install -r "$MODULE/requirements.txt"

      - name: Parse app.py
        run: python -c "import ast; ast.parse(open('$MODULE/app.py', encoding='utf-8').read())"

      - name: Smoke-run app.py with Streamlit AppTest
        # Runs the script headlessly from the repo root, as Streamlit Community Cloud does.
        # Catches import errors (a missing requirement) and exceptions at startup.
        run: |
          python - <<'EOF'
          import os
          import sys

          from streamlit.testing.v1 import AppTest

          module = os.environ["MODULE"]
          path = f"{module}/app.py"
          # `streamlit run` puts the script's folder on sys.path, so `from src import ...` works.
          sys.path.insert(0, os.path.abspath(module))
          at = AppTest.from_file(os.path.abspath(path), default_timeout=120).run()
          if at.exception:
              for exc in at.exception:
                  print(f"::error file={path}::{exc.message}")
                  print("\n".join(exc.stack_trace))
              sys.exit(1)
          print(f"{path} ran without exceptions")
          EOF

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, module]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} module=${{ needs.module.result }}"
          exit 1
      - run: echo "All checks passed."
