name: Bug report
description: Something is broken in a notebook, app, deploy, or CI.
title: "fix(<module>): "
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - 01-intro
        - 02-regression
        - 03-web-app
        - 04-classification
        - 05-clustering
        - 06-nlp
        - 07-timeseries
        - 08-reinforcement
        - 09-real-world
        - repo-wide (CI, docs, tooling)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Streamlit app (local)
        - Streamlit Community Cloud (deployed app)
        - Notebook
        - CI (GitHub Actions)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error message or traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pip install -r 02-regression/requirements.txt
        2. streamlit run 02-regression/app.py
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12.4, commit abc1234
